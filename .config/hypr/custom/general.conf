# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# Fallback for laptop/internal displays. The generated monitors.conf below can
# stay specific to the external monitor, while unmatched screens still get sane
# defaults instead of inheriting a broken layout.
monitor=,preferred,auto,1

# HDMI port: mirror display. To see device name, use `hyprctl monitors`


workspace = special:special, gapsout:12

# ----------- Quickshell Layer Rules -----------_
layerrule = blur on, match:namespace quickshell:.*
layerrule = ignore_alpha 0.50, match:namespace quickshell:.*
layerrule = xray 0, match:namespace quickshell:.*


# Enable blur for xwayland context menus
# windowrule = match:class ^()$, match:title ^()$, no_blur off
# Enable blur for every window
# windowrule = match:class .*, no_blur off


decoration {
    # Global opacity for all windows
    active_opacity = 1.11   # Focused window opacity
    inactive_opacity = 1.0   # Unfocused window opacity
    fullscreen_opacity = 1.1   # Fullscreen windows fully opaque

    # Global blur settings (frosted glass effect)
    blur {
        enabled = true           # Enable blur
        size = 10                # Blur radius
        passes = 3               # More passes = smoother blur
        new_optimizations = true
        xray = false             # Blur the live scene directly behind the layer
        noise = 0.05             # Subtle noise for frosted look
        contrast = 0.89
        brightness = 1
        # ignore_opacity = true   # Don't blur windows more opaque than this
        # vibrancy = 1
        special = false         # Special blur mode for certain apps=
        popups = false           # Layer rules opt individual shell surfaces in
    }
}
